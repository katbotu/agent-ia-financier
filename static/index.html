
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agent IA Financier V2</title>

    <style>
        :root {
            --bg: #08111f;
            --sidebar: #0c1829;
            --panel: #111f32;
            --panel2: #16283d;
            --border: #283a51;
            --text: #f2f6fc;
            --muted: #9aabc2;
            --blue: #38bdf8;
            --green: #34d399;
            --red: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 255px;
            flex-shrink: 0;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 19px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--blue);
            color: #07111f;
            display: grid;
            place-items: center;
            font-size: 22px;
        }

        .brand small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 4px;
        }

        .navigation {
            display: grid;
            gap: 10px;
        }

        .nav-btn {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            text-align: left;
        }

        .nav-btn.active,
        .nav-btn:hover {
            background: var(--panel2);
            border-color: var(--border);
            color: var(--text);
        }

        .sidebar-footer {
            margin-top: auto;
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            display: inline-block;
            margin-bottom: 10px;
            padding: 7px 11px;
            border-radius: 20px;
            background: var(--panel2);
        }

        .online {
            color: var(--green);
        }

        .offline {
            color: var(--red);
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 28px;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 27px;
            margin: 0 0 8px;
        }

        h2 {
            font-size: 21px;
        }

        .subtitle {
            color: var(--muted);
            margin: 0;
            line-height: 1.6;
        }

        .model-picker {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 11px;
        }

        .chat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 17px;
            overflow: hidden;
        }

        .messages {
            height: 460px;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            flex-shrink: 0;
            width: 39px;
            height: 39px;
            display: grid;
            place-items: center;
            background: #263e59;
            border-radius: 11px;
            font-size: 11px;
            font-weight: bold;
        }

        .message.user .avatar {
            background: #075985;
        }

        .message-content {
            min-width: 0;
            max-width: 85%;
            padding: 15px 17px;
            border-radius: 13px;
            background: var(--panel2);
            border: 1px solid var(--border);
        }

        .message.user .message-content {
            background: #123a57;
        }

        .message-text {
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .tools-title {
            font-size: 12px;
            color: var(--muted);
            margin-top: 14px;
            margin-bottom: 8px;
        }

        .tool-list {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .tool-badge {
            font-size: 11px;
            background: #164e45;
            color: #b4f9df;
            border-radius: 20px;
            padding: 6px 9px;
            overflow-wrap: anywhere;
        }

        .document-card {
            margin-top: 15px;
            padding: 15px;
            background: #0d2a38;
            border: 1px solid #176b70;
            border-radius: 12px;
        }

        .document-card p {
            color: var(--muted);
            font-size: 13px;
        }

        .download-btn {
            display: inline-block;
            background: var(--green);
            color: #052b21;
            text-decoration: none;
            font-weight: bold;
            padding: 11px 15px;
            border-radius: 8px;
            margin-top: 5px;
        }

        .pdf-details {
            margin-top: 15px;
        }

        .pdf-details summary {
            cursor: pointer;
            color: var(--blue);
        }

        .pdf-frame {
            width: 100%;
            height: 420px;
            border: none;
            margin-top: 12px;
            background: white;
        }

        .error-box {
            background: #431d2a;
            color: #fecaca;
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
        }

        .chat-bottom {
            border-top: 1px solid var(--border);
            padding: 18px;
        }

        .chat-form {
            display: flex;
            gap: 10px;
        }

        textarea {
            width: 100%;
            min-height: 65px;
            max-height: 160px;
            resize: vertical;
            background: #0c1728;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--blue);
        }

        .primary-btn {
            background: var(--blue);
            border: none;
            color: #082032;
            border-radius: 10px;
            padding: 13px 20px;
            font-weight: bold;
        }

        .secondary-btn {
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 9px;
        }

        .suggestions {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .suggestions button {
            background: #15283b;
            color: #c4d6e9;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 9px 12px;
            font-size: 12px;
        }

        .suggestions button:hover {
            border-color: var(--blue);
        }

        .benchmark-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 24px;
        }

        .benchmark-form {
            display: grid;
            gap: 14px;
        }

        .benchmark-results {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .benchmark-card {
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            min-width: 0;
        }

        .benchmark-card pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #d6e5f5;
            font-family: inherit;
            line-height: 1.6;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 800px) {
            .app {
                display: block;
            }

            .sidebar {
                width: 100%;
                gap: 14px;
            }

            .navigation {
                display: flex;
            }

            .main {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .messages {
                height: 440px;
                padding: 14px;
            }

            .message-content {
                max-width: 90%;
            }

            .benchmark-results {
                grid-template-columns: 1fr;
            }

            .chat-form {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- BARRE LATERALE -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">AI</div>

            <div>
                Agent Financier
                <small>LLM + PostgreSQL • V2</small>
            </div>
        </div>

        <nav class="navigation">

            <button
                class="nav-btn active"
                data-view="chat"
                type="button"
            >
                Assistant IA
            </button>

            <button
                class="nav-btn"
                data-view="benchmark"
                type="button"
            >
                Benchmark IA
            </button>

        </nav>

        <div class="sidebar-footer">
            <div
                id="backendStatus"
                class="status"
            >
                Connexion...
            </div>

            <p>
                FastAPI • PostgreSQL • RLS
            </p>

            <p>
                Tool Calling activé
            </p>
        </div>

    </aside>


    <!-- CONTENU -->
    <main class="main">

        <div class="container">

            <!-- CHAT -->
            <section id="chatView">

                <header class="header">

                    <div>
                        <h1>Assistant IA Financier</h1>

                        <p class="subtitle">
                            Interrogez vos données,
                            analysez vos finances
                            et générez des rapports.
                        </p>
                    </div>

                    <div class="model-picker">

                        <label for="modelSelect">
                            Modèle :
                        </label>

                        <select id="modelSelect">
                            <option value="openai">
                                OpenAI
                            </option>

                            <option value="ollama">
                                Ollama / Qwen
                            </option>
                        </select>

                    </div>

                </header>


                <div class="chat-card">

                    <div
                        id="messages"
                        class="messages"
                        aria-live="polite"
                    ></div>

                    <div class="chat-bottom">

                        <form
                            id="chatForm"
                            class="chat-form"
                        >

                            <textarea
                                id="prompt"
                                placeholder="Ex. Compare mon solde de septembre et octobre 2026..."
                                required
                            ></textarea>

                            <button
                                id="sendBtn"
                                class="primary-btn"
                                type="submit"
                            >
                                Envoyer
                            </button>

                        </form>

                        <div class="suggestions">

                            <button
                                type="button"
                                data-question="Quel est mon solde d'octobre 2026 ?"
                            >
                                Mon solde
                            </button>

                            <button
                                type="button"
                                data-question="Compare mon chiffre d'affaires de septembre et octobre 2026."
                            >
                                Comparer mon CA
                            </button>

                            <button
                                type="button"
                                data-question="Génère un PDF contenant uniquement mes dépenses d'octobre 2026."
                            >
                                PDF dépenses
                            </button>

                            <button
                                type="button"
                                data-question="Exporte mon chiffre d'affaires d'octobre 2026 en CSV."
                            >
                                CSV CA
                            </button>

                            <button
                                type="button"
                                data-question="Compare mon solde de septembre et octobre 2026, puis génère la comparaison en PDF."
                            >
                                Solde + PDF
                            </button>

                        </div>

                        <div style="margin-top:16px">

                            <button
                                id="clearBtn"
                                type="button"
                                class="secondary-btn"
                            >
                                Effacer la conversation
                            </button>

                        </div>

                    </div>

                </div>

            </section>


            <!-- BENCHMARK -->
            <section
                id="benchmarkView"
                hidden
            >

                <header class="header">
                    <div>
                        <h1>Benchmark des modèles IA</h1>

                        <p class="subtitle">
                            Comparez OpenAI et Ollama
                            sur une même question.
                        </p>
                    </div>
                </header>

                <div class="benchmark-panel">

                    <h2>Tester les modèles</h2>

                    <form
                        id="benchmarkForm"
                        class="benchmark-form"
                    >

                        <textarea
                            id="benchmarkPrompt"
                            placeholder="Ex. Compare mes dépenses de septembre et octobre 2026."
                            required
                        ></textarea>

                        <button
                            id="benchmarkBtn"
                            type="submit"
                            class="primary-btn"
                        >
                            Lancer le benchmark
                        </button>

                    </form>

                    <div
                        id="benchmarkResults"
                        class="benchmark-results"
                    ></div>

                </div>

            </section>

        </div>

    </main>

</div>

<script src="/static/script.js?v=2"></script>

</body>
</html>
