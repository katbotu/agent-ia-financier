services:
  postgres:
    image: postgres:16
    container_name: agent-ia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agent_ia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${}
      APP_DB_PASSWORD: ${}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_ia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: